name: Daily News Intel Worker

on:
  schedule:
    # 23:00 UTC = 08:00 KST next day
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      skip_email:
        description: 'Skip sending briefing emails'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper & AI Analyzer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
        run: |
          if [ "${{ github.event.inputs.skip_email }}" = "true" ]; then
            python main.py --skip-email
          else
            python main.py
          fi
